schema: spec-driven

rules:
  tasks:
    - "If this change alters the site's architecture, dependencies, or the post-authoring workflow/features, include a task to update the matching file under docs/ (architecture.md, dependencies.md, writing-posts.md, post-features.md)."

operations:
  apply:
    guidance:
      - "Never commit directly to main/master. Before implementing, create a new git branch dedicated to this change (e.g. named after the change), and commit implementation work there instead."
  archive:
    guidance:
      - "Do not push or merge to main/master as part of archiving. Push the change's branch and open a pull request for review instead."

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
